<!doctype html>
<meta charset="utf-8">
<title>passkeyd e2e</title>
<script>
// Simulate a competing password-manager wrapper (Elpass/1Password-style) that
// hijacks WebAuthn after our content script ran at document_start. The
// extension replaces navigator.credentials with its own container, so none of
// these takeover attempts may end up seeing the request.
window.__competitorSaw = false;
{
  const spy = function (o) {
    window.__competitorSaw = true;
    return CredentialsContainer.prototype.get.call(navigator.credentials, o);
  };
  const wrap = () => {
    // Plain-assignment wrap (absorbed by the extension into its fallback).
    const prev = navigator.credentials.get.bind(navigator.credentials);
    navigator.credentials.get = function (o) {
      window.__competitorSaw = true;
      return prev(o);
    };
    // Elpass-style hard takeovers: non-configurable defineProperty on the
    // container and on navigator.credentials itself. Both must fail against
    // the extension's locks (they throw; a real manager's script would die).
    try {
      Object.defineProperty(navigator.credentials, "get",
        { value: spy, configurable: false });
    } catch {}
    try {
      Object.defineProperty(navigator, "credentials",
        { value: { get: spy, create: spy }, configurable: false });
    } catch {}
  };
  wrap();
  // Some managers (re-)wrap well after window load; this listener registers
  // before the test's own load handler, so the late wrap lands first.
  window.addEventListener("load", wrap);
}
</script>
<script>
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)))
  .replaceAll("+", "-").replaceAll("/", "_").replace(/=+$/, "");
window.addEventListener("load", async () => {
  const out = { ok: false, token: new URLSearchParams(location.search).get('token') };
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    out.challenge = b64u(challenge);

    // Exercise the page-to-extension boundary directly, bypassing the MAIN
    // shim just as an injected script would. Negative ids avoid shim requests.
    let bridgeSeq = 0;
    function bridge(payload) {
      return new Promise((resolve, reject) => {
        const reqId = --bridgeSeq;
        const receive = (ev) => {
          const resp = ev.data && ev.data.__passkeyd_resp;
          if (ev.source !== window || !resp || resp.reqId !== reqId) return;
          clearTimeout(timer);
          window.removeEventListener("message", receive);
          resolve(resp);
        };
        const timer = setTimeout(() => {
          window.removeEventListener("message", receive);
          reject(new Error("raw bridge timed out"));
        }, 15000);
        window.addEventListener("message", receive);
        window.postMessage({ __passkeyd_req: { ...payload, reqId } }, window.origin);
      });
    }
    out.spoofedRps = [];
    for (const op of ["has", "get", "create"]) {
      out.spoofedRps.push(await bridge({ op, rpId: "github.com",
        origin: "https://github.com", challenge: out.challenge }));
    }
    out.captureDisabled = await bridge({ op: "create", rpId: "localhost",
      challenge: out.challenge, user: { id: "YQ", name: "test" }, algs: [-7] });
    const forged = new TextEncoder().encode(JSON.stringify({
      type: "webauthn.get", challenge: out.challenge, origin: "https://github.com",
      crossOrigin: false,
    }));
    out.bridgeAssertion = await bridge({ op: "get", rpId: "localhost",
      origin: "https://github.com", challenge: out.challenge,
      clientDataJSON: b64u(forged),
      clientDataHash: b64u(await crypto.subtle.digest("SHA-256", forged)) });

    // A pre-aborted request must reject with AbortError immediately and must
    // not consume the intercept window.
    try {
      const ac = new AbortController();
      ac.abort();
      await navigator.credentials.get({
        publicKey: { rpId: "localhost", challenge, timeout: 60000 },
        signal: ac.signal,
      });
      out.abortName = "no-error";
    } catch (e) {
      out.abortName = e.name;
    }

    // An overlapping modal request while one is inside passkeyd must fail
    // like the native stack fails overlapping requests ("already pending"),
    // not fall through to the platform authenticator.
    const p1 = navigator.credentials.get({
      publicKey: { rpId: "localhost", challenge, timeout: 60000 },
    });
    try {
      await navigator.credentials.get({
        publicKey: {
          rpId: "localhost",
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          timeout: 60000,
        },
      });
      out.overlapName = "no-error";
    } catch (e) {
      out.overlapName = e.name;
      out.overlapMessage = e.message;
    }

    const cred = await p1;
    out.id = cred.id;
    out.isPKC = cred instanceof PublicKeyCredential;
    out.clientDataJSON = b64u(cred.response.clientDataJSON);
    out.authenticatorData = b64u(cred.response.authenticatorData);
    out.signature = b64u(cred.response.signature);
    out.userHandle = cred.response.userHandle ? b64u(cred.response.userHandle) : null;
    out.json = cred.toJSON ? cred.toJSON() : null;
    out.competitorSaw = window.__competitorSaw;
    out.ok = true;
  } catch (e) {
    out.error = String(e && e.stack ? e.stack : e);
  }
  await fetch("/result", { method: "POST", body: JSON.stringify(out) });
  document.title = "e2e-done";
});
</script>
